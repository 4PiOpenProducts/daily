name: Push to Daily Apps

on:
  workflow_dispatch:
    inputs:
      day_name:
        description: '追加するディレクトリ名（例: day1）'
        required: true
        type: string

jobs:
  subtree-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push via Split and Force Push
        env:
          PAT: ${{ secrets.ACCESS_TOKEN }}
        run: |
          DAY_NAME="${{ github.event.inputs.day_name }}"

          # 1. ルート直下の全ファイルを指定されたディレクトリ名（例: day1）にリライトした一時ブランチを作成する
          git checkout -b temp-export-branch
          
          # 2. 独自のインデックスを使って新しいコミットを作り、指定フォルダの形に包む
          mkdir -p "$DAY_NAME"
          # .git や workflow などの不要なものを除きつつファイルを移動
          git ls-files | while read file; do
            if [[ "$file" != .github* ]]; then
              mkdir -p "$DAY_NAME/$(dirname "$file")"
              cp "$file" "$DAY_NAME/$file"
              git add "$DAY_NAME/$file"
              git rm --cached "$file" || true
            fi
          done
          
          git commit -m "feat: wrap into $DAY_NAME"

          # 3. リモート（daily-apps）に接続してプッシュする
          git remote add apps-origin https://${{ env.PAT }}@github.com/${{ github.repository_owner }}/daily-apps.git
          git fetch apps-origin main
          
          # リモートの履歴と安全にマージ（初回の空リポジトリや既存リポジトリの両方に対応）
          git checkout -b remote-main apps-origin/main || git checkout -b remote-main
          git merge temp-export-branch --allow-unrelated-histories -m "Merge $DAY_NAME"
          
          # daily-apps の main へ送信
          git push apps-origin remote-main:main
